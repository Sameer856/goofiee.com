<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Reena for kids</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon.png">
    <link rel="shortcut icon" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; overflow: hidden; background: #000;">
    <!-- Loading Screen -->
    <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;">
      <div style="text-align: center; color: white; font-family: Arial, sans-serif;">
        <img src="marmalady-loading-cat.gif" alt="Loading..." style="width: 200px; height: auto; display: block; margin: 0 auto;">
        <p style="margin-top: 20px; font-size: 16px; opacity: 0.8;">Please wait while we prepare your adventure...</p>
      </div>
    </div>
    <canvas id="unity-canvas" width=1366 height=786 tabindex="-1" style="width: 1366px; height: 786px; background: #FFFFFF"></canvas>
    <script src="Build/Reena_V4.2.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Reena_V4.2.data",
        frameworkUrl: "Build/Reena_V4.2.framework.js",
        codeUrl: "Build/Reena_V4.2.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "RoboVision",
        productName: "Reena",
        productVersion: "4.2",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
        // Hide loading screen when Unity instance is created
        document.getElementById('loading-screen').style.display = 'none';
      }).catch((message) => {
        alert(message);
      });
    </script>
    
    <!-- Footer -->
    <footer style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.9); padding: 15px; text-align: center; z-index: 1000;">
      <div style="color: white; margin-bottom: 10px; font-size: 14px;">
        <strong>Goofiee (by Robovision Pvt Ltd)</strong>
      </div>
      <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 8px;">
        <a href="/cancellation-and-refund" style="color: #ff6b35; text-decoration: none; font-size: 12px;">Cancellation & Refund</a>
        <a href="/terms-and-conditions" style="color: #ff6b35; text-decoration: none; font-size: 12px;">Terms & Conditions</a>
        <a href="/shipping" style="color: #ff6b35; text-decoration: none; font-size: 12px;">Shipping</a>
        <a href="/privacy" style="color: #ff6b35; text-decoration: none; font-size: 12px;">Privacy Policy</a>
        <a href="/contact-us" style="color: #ff6b35; text-decoration: none; font-size: 12px;">Contact Us</a>
      </div>
      <div style="color: #ccc; font-size: 11px;">
        <a href="mailto:support@robovision.in" style="color: #ff6b35; text-decoration: none;">support@robovision.in</a> | +91-00000-00000
      </div>
    </footer>
  </body>
</html>
